<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha | Agência Distinto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'],
          },
          colors: {
            distinto: {
              gold: '#D4AF37',
              sand: '#EDE6D8',
              dark: '#0E1310',
              card: '#161D18',
              border: '#27332B'
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(22, 29, 24, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(237, 230, 216, 0.12);
    }
  </style>
</head>
<body class="bg-[#0A0E0B] text-distinto-sand font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-amber-400 selection:text-black">

  <!-- Background Orbs -->
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full bg-[#1E3326]/60 blur-[130px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-[650px] h-[650px] rounded-full bg-[#52442C]/40 blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/5 border border-white/10 shadow-2xl p-3 mb-4 backdrop-blur-md">
        <svg class="w-full h-full text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-display font-semibold tracking-tight text-white">
        Redefinir Senha
      </h1>
      <p class="text-xs sm:text-sm text-distinto-sand/60 mt-1">
        Crie uma nova senha de acesso para a sua conta.
      </p>
    </div>

    <!-- Card Form -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      <form id="resetForm" class="space-y-5" onsubmit="handleResetPassword(event)">
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-distinto-sand/70 mb-2">
            Nova Senha
          </label>
          <input 
            type="password" 
            id="newPassword" 
            required
            placeholder="Digite sua nova senha..." 
            class="w-full px-4 py-3 rounded-xl bg-black/40 border border-distinto-border text-white text-sm placeholder-white/20 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-distinto-sand/70 mb-2">
            Confirme a Nova Senha
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            required
            placeholder="Digite a nova senha novamente..." 
            class="w-full px-4 py-3 rounded-xl bg-black/40 border border-distinto-border text-white text-sm placeholder-white/20 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition"
          />
        </div>

        <div id="resetMessage" class="hidden p-3 rounded-xl text-xs flex items-center gap-2"></div>

        <button 
          type="submit" 
          id="resetBtn"
          class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 text-black font-semibold text-sm tracking-wide shadow-lg shadow-amber-400/10 hover:shadow-amber-400/25 transition duration-200 flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Atualizar Senha</span>
          <span class="text-base">→</span>
        </button>

        <div class="text-center pt-2">
          <a href="/" class="text-xs text-distinto-sand/60 hover:text-amber-300 transition">
            ← Voltar para o Login
          </a>
        </div>

      </form>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      const msg = document.getElementById('resetMessage');
      msg.className = 'p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2';
      msg.innerHTML = '<span>⚠️ Link de recuperação inválido ou token ausente.</span>';
      msg.classList.remove('hidden');
      document.getElementById('resetBtn').disabled = true;
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('resetMessage');
      const btn = document.getElementById('resetBtn');

      if (p1 !== p2) {
        msg.className = 'p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2';
        msg.innerHTML = '<span>⚠️ As senhas não coincidem.</span>';
        msg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Salvando...</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: p1 })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao redefinir senha.');

        msg.className = 'p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2';
        msg.innerHTML = `<span>✅ ${data.message} Redirecionando...</span>`;
        msg.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = '/';
        }, 2000);

      } catch (err) {
        msg.className = 'p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2';
        msg.innerHTML = `<span>⚠️ ${err.message}</span>`;
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Atualizar Senha</span><span class="text-base">→</span>';
      }
    }
  </script>
</body>
</html>
